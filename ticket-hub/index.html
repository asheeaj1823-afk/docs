<title>Ziar Imaar Ticket Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one shared visit store; technician phone flow (420px column), office review (3-pane desktop) and dashboard (KPIs + table). Dark-only, Ziar Imaar navy and gold. */
:root{
  color-scheme:dark;
  --bg:#0a1733; --panel:#0e1f42; --card:#132a54; --sel:#1c335f; --line:#24396a; --line2:#3a5287; --muted3:#5d72a3;
  --fg:#eef1f8; --fg2:#cdd6ea; --muted:#9fb0d2; --dim:#7f90b6;
  --accent:#d6a83e; --accent2:#f1d27f; --accentDeep:#a8822c; --chip:#2a3f6e; --chipFg:#e6ecfa; --white:#ffffff;
  --warn:#f3c56a; --ok:#93d9b4; --bad:#f2a0a0; --noteBg:#2a2615;
  --s-new:#8fb8f0; --s-review:#d6a83e; --s-completed:#5fc49a; --s-recheck:#e9894f; --s-cancelled:#c26b85;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; --brand:Montserrat,Inter,system-ui,sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent2)}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:6px}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mono{font-family:var(--mono);font-size:12px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.sub{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--chip);color:var(--chipFg);white-space:nowrap}
.chip.review{background:#3a3418;color:var(--accent2)}.chip.completed{background:#173f39;color:var(--ok)}.chip.cancelled{background:#43233a;color:var(--bad)}.chip.recheck{background:#3f2a15;color:var(--warn)}
.chip.sla-late{background:#4a1f2a;color:var(--bad)}.chip.sla-risk{background:#3f3115;color:var(--warn)}.chip.sla-ok{background:transparent;color:var(--muted);border:1px solid var(--line2)}
.prio{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.prio.Urgent{color:var(--bad)}.prio.High{color:var(--warn)}.prio.Normal{color:var(--muted)}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);box-shadow:inset 0 -1px 0 var(--accentDeep);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .row{max-width:1280px;margin:0 auto;flex-wrap:wrap;row-gap:8px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.wm{display:flex;flex-direction:column;line-height:1}
.wm b{font-family:var(--brand);font-weight:700;font-size:17px;letter-spacing:.06em;color:var(--white);display:flex;align-items:center;gap:6px}
.wm b i{display:inline-block;width:18px;height:2px;background:var(--accent);border-radius:2px}
.wm small{font-family:var(--brand);font-weight:500;font-size:8.5px;letter-spacing:.32em;color:var(--fg2);margin-top:4px}
.client{font-size:12px;color:var(--muted);border-left:1px solid var(--line2);padding-left:12px;line-height:1.3}
.seg{display:inline-flex;background:var(--card);border-radius:10px;padding:3px}
.seg button{height:32px;padding:0 12px;border-radius:8px;color:var(--fg2);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--white);font-weight:600;box-shadow:inset 0 0 0 1px var(--accent)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--bg);font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.who{display:flex;align-items:center;gap:10px;font-size:12px}
.mode{color:var(--muted)}.mode.demo{color:var(--warn)}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--bg);background:var(--accent2);flex:none}
@media (max-width:520px){.client,.who .nm{display:none}}

/* technician */
.phone{max-width:420px;margin:0 auto;min-height:calc(100% - 56px);display:flex;flex-direction:column}
.bar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 4px}
.icon{width:44px;height:44px;display:grid;place-items:center;color:var(--fg);border-radius:10px}
.icon.txt{color:var(--muted);font-size:13px;width:auto;min-width:44px;padding:0 6px}
.bar .t{font-weight:600;font-size:16px}
.scroll{flex:1;padding:4px 16px 16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ghost{height:44px;border-radius:10px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:500;text-decoration:none;color:var(--fg)}
.list{background:var(--card);border-radius:14px;overflow:hidden}
.step{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.step:first-child{border-top:none}
.step.cur{background:var(--sel)}
.dot{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:600;border:1.5px solid var(--muted3);color:var(--muted)}
.dot.done{background:var(--accentDeep);color:var(--white);border:0}
.dot.cur{border:2px solid var(--accent);color:var(--accent2)}
.chev{color:var(--muted)}
.foot{position:sticky;bottom:0;padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:8px}
.primary{height:48px;border-radius:12px;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:600;width:100%}
.primary:disabled{background:var(--line);color:var(--dim);cursor:not-allowed}
.secondary{height:48px;border-radius:12px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-weight:500;color:var(--fg);width:100%}
.hint{text-align:center;font-size:12px;color:var(--muted)}
.field{display:block;width:100%;margin-top:6px;border-radius:12px;border:1px solid var(--line2);background:var(--card);padding:12px;color:var(--fg);resize:vertical}
.field::placeholder{color:var(--muted)}
.stamps{display:flex;gap:10px;margin-top:6px}
.stamp{flex:1;min-height:64px;border-radius:12px;border:1px dashed var(--muted3);display:flex;flex-direction:column;justify-content:center;padding:10px 12px;text-align:left}
.stamp.on{border:1.5px solid var(--accent);background:var(--sel)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);font-weight:500;color:var(--fg2);font-size:14px}
.pill[aria-pressed="true"]{border-color:var(--accent);background:var(--sel);color:var(--white)}
.drop{margin-top:6px;min-height:64px;border-radius:12px;border:1.5px dashed var(--muted3);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--fg2);width:100%;position:relative;cursor:pointer}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:8px}
.thumb{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:10px;border:1px solid var(--line2);background:var(--card);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center;padding:4px;word-break:break-all;text-decoration:none}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:6px;background:rgba(10,23,51,.85);color:var(--fg)}
.thumb .tag{position:absolute;left:4px;bottom:4px;background:rgba(10,23,51,.85);border-radius:4px;padding:1px 5px;color:var(--fg2);font-weight:600}
.sig{margin-top:6px;border-radius:12px;border:1px solid var(--line2);background:#f4f1e6;position:relative;touch-action:none}
.sig canvas{display:block;width:100%;height:150px;border-radius:12px;cursor:crosshair}
.sig .base{position:absolute;left:16px;right:16px;bottom:34px;border-bottom:1px dashed #9a9078;pointer-events:none}
.sig .ph{position:absolute;left:16px;bottom:12px;font-size:12px;color:#6d6551;pointer-events:none}
.sig .clr{position:absolute;top:8px;right:8px;height:28px;padding:0 10px;border-radius:8px;background:#e3dcc7;color:#3b3527;font-size:12px;font-weight:600}
.sigimg{background:#f4f1e6;border-radius:10px;padding:6px;max-width:260px}
.sigimg img{display:block;width:100%;height:auto}
.note{border:1px solid var(--warn);background:var(--noteBg);border-radius:12px;padding:12px;font-size:14px;color:var(--fg)}
.timeline{display:flex;flex-direction:column;gap:10px;border-left:2px solid var(--line2);padding-left:14px}
.kv{display:flex;justify-content:space-between;gap:12px}
.kv span:first-child{color:var(--muted)}
.partrow{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.partrow:first-child{border-top:0}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:8px}
.qty button{width:32px;height:32px}
.qty span{min-width:22px;text-align:center}
.inline{display:flex;gap:8px;margin-top:6px}
.inline .field{margin-top:0}
.small-btn{height:44px;padding:0 14px;border-radius:12px;background:var(--sel);border:1px solid var(--accent);color:var(--white);font-weight:600;flex:none}
.visitlink{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.callbox{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--sel);border-radius:10px;padding:8px 12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);font-size:13px;color:var(--fg2)}
.tabs button[aria-pressed="true"]{background:var(--sel);border-color:var(--accent);color:var(--white);font-weight:600}

/* office */
.officebar,.dashbar{max-width:1280px;margin:0 auto;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);flex-wrap:wrap}
.office{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr) 330px;min-height:calc(100% - 112px)}
.pager{display:flex;align-items:center;gap:6px;color:var(--fg2);font-size:14px;flex-wrap:wrap}
.pager button{padding:4px 8px;border-radius:6px;background:var(--card)}
.pager button[aria-current="true"]{background:var(--sel);color:var(--white);font-weight:600;box-shadow:inset 0 0 0 1px var(--accent)}
.pager button:disabled{opacity:.4;cursor:default}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--fg2)}
.queue{border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.q{border:1px solid var(--line);border-radius:8px;padding:10px;text-align:left;width:100%;display:flex;flex-direction:column;gap:4px}
.q[aria-current="true"]{border:1.5px solid var(--accent);background:var(--sel)}
.detail{padding:20px 24px;display:flex;flex-direction:column;gap:18px;font-size:14px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--card);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tbl{border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.tr{display:grid;grid-template-columns:1.1fr 1.7fr .8fr;padding:8px 12px;border-top:1px solid var(--line);min-width:380px;gap:8px}
.tr.h{background:var(--card);color:var(--muted);font-size:12px;border-top:0}
.tr.flag{background:var(--sel)}
.m-ok{color:var(--ok)}.m-bad{color:var(--warn);font-weight:600}
.decide{border-left:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:12px;background:var(--panel);font-size:14px}
.btn{height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:500;width:100%;border:1px solid var(--line2);color:var(--fg);padding:0 12px;text-decoration:none}
.btn.go{background:var(--accent);color:var(--bg);font-weight:600;border:0}
.btn.ai{border-style:dashed;border-color:var(--accent);color:var(--accent2);height:34px;font-size:13px}
.btn.inl{width:auto}
.btn:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--warn);font-size:12px;min-height:16px}
.empty{color:var(--muted);padding:24px;text-align:center}

/* dashboard */
.dash{max-width:1280px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi b{font-family:var(--brand);font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--white);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi.alert b{color:var(--bad)}
.kpi.gold{background:linear-gradient(135deg,var(--sel),var(--card));box-shadow:inset 0 0 0 1px var(--accentDeep)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--card);gap:2px}
.stack span{display:block;height:100%;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--fg2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .field{margin:0;height:40px;padding:0 12px;border-radius:10px;max-width:300px;flex:1 1 200px}
.grid-tbl{border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:980px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--card);padding:10px 12px;white-space:nowrap}
th button{color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover,tbody tr:focus-visible{background:var(--panel)}
.dispatch{background:var(--panel);border:1px solid var(--accentDeep);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.fgrid label{display:flex;flex-direction:column;font-size:12px;color:var(--fg2);font-weight:500;min-width:0}
.fgrid .field{margin-top:4px;padding:10px;border-radius:10px}
.span2{grid-column:span 2}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sel);border:1px solid var(--accent);color:var(--white);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:960px){
  .office{grid-template-columns:1fr}
  .queue{border-right:0;border-bottom:1px solid var(--line)}
  .decide{border-left:0;border-top:1px solid var(--line)}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .detail,.queue,.decide{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.fgrid{grid-template-columns:1fr}.span2{grid-column:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="row">
    <div class="brand"><div class="wm" aria-label="Ziar Imaar Technical Services"><b>ZIAR <i></i> IMAAR</b><small>TECHNICAL SERVICES</small></div><span class="client">Kohler UAE<br>Ticket hub</span></div>
    <div class="seg" role="group" aria-label="View">
      <button id="v-tech" type="button">Technician</button>
      <button id="v-office" type="button">Office <span id="qbadge" class="badge" hidden></span></button>
      <button id="v-dash" type="button">Dashboard</button>
    </div>
    <div class="who"><span id="mode" class="mode">Connecting…</span><span id="me" class="who"></span></div>
  </div>
</header>
<main id="app"></main>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(() => {
const STATUS={new:'New',review:'Ready for review',completed:'Completed',recheck:'Recheck',cancelled:'Cancelled'};
const SLA_HOURS={Urgent:4,High:24,Normal:72};
const PHONE='+971 4 362 7500';
let visits={};
let db=null, assets=null, userApi=null, sampleApi=null, downloadsApi=null;
let me={id:null,name:''};
const names={};               // user id -> display name, resolved at render and never stored
let demo=false, loaded=false;
let view='tech';
let tech={screen:'list',id:null,draft:null,tab:'todo',showCall:false,uploading:0,limit:25};
let office={id:null,note:'',keep:false,drafting:false};
let dash={q:'',status:'all',sort:'scheduled',dir:'desc',showForm:false,form:{}};
const $app=document.getElementById('app');

/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const hm=iso=>{ if(!iso) return ''; const d=new Date(iso); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const dm=iso=>{ if(!iso) return ''; const d=new Date(iso); return d.getDate()+' '+MON[d.getMonth()]; };
const dmhm=iso=>iso?dm(iso)+' · '+hm(iso):'';
const dayLong=iso=>{ if(!iso) return 'Date not set'; const d=new Date(iso); return DAY[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]+' · '+hm(iso); };
const dur=min=>{ if(min==null||isNaN(min)) return '—'; const h=Math.floor(min/60), m=Math.round(min%60); return h>=48?Math.round(h/24)+'d':h?h+'h '+pad(m)+'m':m+'m'; };
const clone=o=>JSON.parse(JSON.stringify(o));
const safeUrl=u=>typeof u==='string'&&/^(\/|https:)/.test(u)?u:'';
const partsCount=v=>(v.parts||[]).reduce((a,p)=>a+(+p.qty||0),0);
const evItems=v=>(v.evidence||[]).map(e=>typeof e==='string'?{name:e,type:/\.pdf$/i.test(e)?'application/pdf':'image/*'}:e);
const isPdf=e=>/pdf/i.test(e.type||'')||/\.pdf$/i.test(e.name||'');
const evidenceLabel=v=>{ const e=evItems(v); if(!e.length) return 'None'; const pdf=e.filter(isPdf).length, ph=e.length-pdf; return [ph?ph+' photo'+(ph>1?'s':''):'',pdf?pdf+' PDF':''].filter(Boolean).join(', '); };
const onsite=v=>v.arrived&&v.finished?(new Date(v.finished)-new Date(v.arrived))/60000:null;
const canSubmit=v=>!!(v.arrived&&(v.work||'').trim());
const editable=v=>v.status==='new'||v.status==='recheck';
const createdAt=v=>(v.history&&v.history[0]&&v.history[0].at)||v.scheduled;
const phoneOf=v=>v.phone||(((v.contact||'').match(/\+?\d[\d\s-]{6,}\d/)||[])[0]||'');
const nameOf=id=>id?(id===me.id?'You':(names[id]||'Team member')):'';
const initials=n=>(n||'?').split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2800); }

function sla(v){
  const hrs=SLA_HOURS[v.priority||'Normal']||72;
  const due=new Date(new Date(createdAt(v)).getTime()+hrs*3600000);
  const sched=new Date(v.scheduled);
  const target=sched>due?sched:due;   // a visit booked later than the SLA, at the customer's request, follows the booking
  if(v.status==='cancelled'||!v.scheduled||((v.status==='completed'||v.status==='review')&&!v.arrived)) return {cls:'sla-ok',label:'—',late:false,target};
  if(v.arrived){ const late=new Date(v.arrived)>target; return {cls:late?'sla-late':'sla-ok',label:late?'Missed':'Met',late,target}; }
  const left=(target-Date.now())/3600000;
  if(left<0) return {cls:'sla-late',label:'Overdue '+dur(-left*60),late:true,target};
  if(left<6) return {cls:'sla-risk',label:'Due in '+dur(left*60),late:false,target};
  return {cls:'sla-ok',label:'Due '+dm(target.toISOString()),late:false,target};
}
function checks(v){
  return [
    {f:'Work performed',ok:!!(v.work||'').trim(),val:(v.work||'').trim()?'Recorded':'—',req:true},
    {f:'Time in / out',ok:!!(v.arrived&&v.finished),val:v.arrived?hm(v.arrived)+' – '+(hm(v.finished)||'not stamped'):'—',req:true},
    {f:'Outcome',ok:!!v.outcome,val:v.outcome||'—',req:true},
    {f:'Technicians',ok:!!(v.technician||'').trim(),val:v.technician||'—',req:true},
    {f:'Z Invoice No.',ok:!!(v.billingRef||'').trim(),val:v.billingRef||'—',req:true},
    {f:'Photos / documents',ok:evItems(v).length>0,val:evidenceLabel(v),req:false},
    {f:'Customer sign-off',ok:!!v.signature,val:v.signature?(v.signerName||'Signed'):'—',req:false},
  ].map(c=>Object.assign(c,{label:c.ok?'Done':c.req?'⚠ Missing':'Optional'}));
}
const missingChecks=v=>checks(v).filter(c=>c.req&&!c.ok);
function flagSummary(v){
  const bad=missingChecks(v);
  if(!bad.length) return 'Ready to close';
  if(bad.length===1) return bad[0].f+' missing';
  return bad.length+' items missing';
}
const flagCount=v=>missingChecks(v).length;

/* ---------- persistence ---------- */
async function save(v){
  v.updatedAt=new Date().toISOString();
  visits[v.id]=clone(v);
  render();
  if(db){
    try{ await db.doc('visits/'+v.id).set(clone(v)); }
    catch(e){ const c=e&&e.code; toast(c==='not_granted'||c==='permission_denied'||c==='forbidden'?'You can view this hub but not change it. Ask the owner for edit access.':'Could not save. Check your connection and try again.'); }
  }
}
function hist(status,note){ const h={status,at:new Date().toISOString()}; if(note) h.note=note; if(me.id) h.by=me.id; return h; }
async function resolveNames(){
  if(!userApi||!userApi.profiles) return;
  const ids=new Set(); Object.values(visits).forEach(v=>(v.history||[]).forEach(h=>h.by&&ids.add(h.by)));
  const need=[...ids].filter(id=>!(id in names)&&id!==me.id); if(!need.length) return;
  try{ const ps=await userApi.profiles(need); need.forEach(id=>names[id]=(ps&&ps[id]&&ps[id].name)||''); safeRender(); }catch(e){}
}

const reviewQueue=()=>Object.values(visits).filter(v=>v.status==='review').sort((a,b)=>lastAt(a).localeCompare(lastAt(b)));
function officeView(){
  const queue=reviewQueue(), rechecks=Object.values(visits).filter(v=>v.status==='recheck');
  if(!office.id||!visits[office.id]||(visits[office.id].status!=='review'&&!office.keep)) office.id=queue[0]?.id||null;
  const v=office.id&&visits[office.id];
  const idx=queue.findIndex(q=>q.id===office.id);
  const bar=`<div class="officebar"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span style="font-weight:600;font-size:16px">Review queue</span><span class="sub num">${queue.length} waiting · oldest first</span><span class="sub"><kbd>J</kbd> <kbd>K</kbd> to move</span></div>
    <div class="pager">${queue.length?`<button data-page="-1" aria-label="Previous visit" ${idx<=0?'disabled':''}>‹</button>${queue.map(q=>`<button data-sel="${esc(q.id)}" aria-current="${q.id===office.id}">#${esc(q.id)}</button>`).join('')}<button data-page="1" aria-label="Next visit" ${idx<0||idx>=queue.length-1?'disabled':''}>›</button>`:''}</div></div>`;
  const qcol=`<aside class="queue"><div class="lbl">Ready for review</div>
    ${queue.length?queue.map(q=>{ const bad=flagCount(q), sub=(q.history||[]).slice(-1)[0]; return `<button class="q" data-sel="${esc(q.id)}" aria-current="${q.id===office.id}"><div class="row" style="gap:6px"><span style="font-weight:${q.id===office.id?600:500}">#${esc(q.id)} · ${esc(q.site)}</span>${bad?`<span style="color:var(--warn);font-size:12px;white-space:nowrap">⚠ ${bad}</span>`:'<span style="color:var(--ok);font-size:12px">✓</span>'}</div><div class="sub">${esc(flagSummary(q))}</div><div class="sub">Sent ${esc(dmhm(sub&&sub.at))}${sub&&sub.by?' · '+esc(nameOf(sub.by)):''}</div></button>`; }).join(''):'<div class="sub">Nothing waiting. Submitted visits appear here.</div>'}
    <div class="lbl" style="margin-top:10px">With technician for recheck · ${rechecks.length}</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">${rechecks.length?rechecks.map(r=>`<button class="chip recheck" data-goto="${esc(r.id)}">#${esc(r.id)}</button>`).join(''):'<span class="sub">None</span>'}</div></aside>`;
  if(!v) return bar+`<div class="office">${qcol}<section class="detail"><div class="empty">${loaded?'The queue is clear. When a technician submits a visit, it shows up here for review.':'Loading visits…'}</div></section><aside class="decide"></aside></div>`;

function dashRows(){
  const q=dash.q.trim().toLowerCase();

  rows.sort((a,b)=>{ const x=key(a),y=key(b); return (x<y?-1:x>y?1:0)*(dash.dir==='asc'?1:-1); });
  return rows;
}
function dashTable(){

}

function safeRender(){ const a=document.activeElement; if(editing()||(a&&$app.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))||(view==='dash'&&dash.showForm)){ header(); return; } render(); }

/* ---------- signature pad ---------- */
function initSig(){
  const c=document.getElementById('sigpad'); if(!c) return;
  const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr);
  const ctx=c.getContext('2d'); ctx.scale(dpr,dpr); ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#14213d';
  if(tech.draft.signature){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,r.width,r.height); img.src=tech.draft.signature; }
  let drawing=false, last=null;
  const pt=e=>{ const b=c.getBoundingClientRect(); return {x:e.clientX-b.left,y:e.clientY-b.top}; };
  c.addEventListener('pointerdown',e=>{ drawing=true; last=pt(e); try{ c.setPointerCapture(e.pointerId); }catch(_){} const ph=c.parentElement.querySelector('.ph'); if(ph) ph.remove(); e.preventDefault(); });
  c.addEventListener('pointermove',e=>{ if(!drawing) return; const p=pt(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; });
  const end=()=>{ if(!drawing) return; drawing=false; tech.draft.signature=c.toDataURL('image/png'); };
  c.addEventListener('pointerup',end); c.addEventListener('pointercancel',end);
}

const dispatchField=t=>{ if(t.form&&t.form.id==='dispatch'&&t.name) dash.form[t.name]=t.value; };
$app.addEventListener('input',e=>{
  const t=e.target;

$app.addEventListener('change',async e=>{
  const t=e.target; dispatchField(t);
  if(t.id!=='f-evidence') return;
  const files=[...t.files]; if(!files.length) return;
  const draftRef=tech.draft; tech.uploading=files.length; render();
  for(const f of files){
    const item={name:f.name,type:f.type||''};
    if(assets){
      try{ const r=await assets.upload(f); item.id=r.id; item.url=r.url; item.type=r.contentType||item.type; }
      catch(err){ const c=err&&err.code; toast(c==='too_large'?f.name+' is over 20 MB and was not uploaded.':c==='unsupported_type'?f.name+' is not a photo or PDF.':'Could not upload '+f.name+'. Its name is saved instead.'); }
    }
    draftRef.evidence=[...evItems(draftRef),item];
    if(tech.draft===draftRef){ tech.uploading=Math.max(0,tech.uploading-1); render(); }
  }
  if(tech.draft===draftRef){ tech.uploading=0; render(); }
});

$app.addEventListener('click',async e=>{

  const ds=b.dataset, v=tech.id&&visits[tech.id];

    if(ds.step==='prepare'){ const n=clone(v); n.prepared=!n.prepared; n.contactedAt=n.prepared?new Date().toISOString():null; await save(n); toast(n.prepared?'Marked as contacted':'Prepare step reopened'); return; }

  if(ds.rmev){ tech.draft.evidence.splice(+ds.rmev,1); render(); return; }
  if(ds.q){ const p=tech.draft.parts[+ds.q]; p.qty+= +ds.dq; if(p.qty<=0) tech.draft.parts.splice(+ds.q,1); render(); return; }
  if(ds.sel){ office.id=ds.sel; office.note=''; office.keep=false; render(); return; }
  if(ds.goto){ office.id=ds.goto; office.keep=true; office.note=''; render(); return; }
  if(ds.page){ const q=reviewQueue(); const i=q.findIndex(x=>x.id===office.id)+ +ds.page; if(q[i]){ office.id=q[i].id; office.note=''; render(); } return; }
  if(ds.dstat){ dash.status=ds.dstat; render(); return; }
  if(ds.dsort){ if(dash.sort===ds.dsort) dash.dir=dash.dir==='asc'?'desc':'asc'; else { dash.sort=ds.dsort; dash.dir='asc'; } document.getElementById('d-table').innerHTML=dashTable(); return; }
  if(ds.decide){
    const ov=visits[office.id]; const note=office.note.trim();
    if(ds.decide!=='completed'&&!note){ document.getElementById('o-err').textContent='Add a review note so the technician knows why.'; document.getElementById('o-note').focus(); return; }
    const n=clone(ov); n.status=ds.decide; n.history=[...(n.history||[]),hist(ds.decide,note)];
    office.note=''; office.id=null; office.keep=false; await save(n);
    toast({completed:'#'+n.id+' marked completed',recheck:'#'+n.id+' returned to the technician',cancelled:'#'+n.id+' cancelled'}[ds.decide]); return;
  }
  const act=ds.act;
  if(act==='more'){ tech.limit+=25; render(); return; }
  if(act==='call'){ tech.showCall=!tech.showCall; render(); return; }
  if(act==='copy'){ const el=document.getElementById('phone-num'); try{ await navigator.clipboard.writeText(el.textContent); toast('Number copied'); }catch(err){ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Number selected. Copy it from here.'); } return; }
  if(act==='clearsig'){ tech.draft.signature=null; render(); return; }
  if(act==='savevisit'||act==='saveparts'||act==='savebilling'){
    const d=tech.draft, n=clone(visits[d.id]);
    if(act==='savevisit') Object.assign(n,{arrived:d.arrived||null,finished:d.finished||null,findings:d.findings||'',work:d.work||'',outcome:d.outcome||'',evidence:d.evidence,signature:d.signature||null,signerName:(d.signerName||'').trim(),technician:(d.technician||'').trim(),nextAction:(d.nextAction||'').trim(),returnVisit:d.returnVisit||'No'});
    if(act==='saveparts') n.parts=d.parts;
    if(act==='savebilling') n.billingRef=d.billingRef||'';
    tech.screen='hub'; tech.draft=null; await save(n); toast('Saved'); window.scrollTo(0,0); return;
  }
  if(act==='submit'){ if(!canSubmit(v)) return; const n=clone(v); n.status='review'; n.history=[...(n.history||[]),hist('review')]; await save(n); toast('Submitted for review'); window.scrollTo(0,0); return; }
  if(act==='reopen'){ const n=clone(visits[office.id]); n.status='review'; n.history=[...(n.history||[]),hist('review','Reopened by the office')]; await save(n); toast('#'+n.id+' is back in the review queue'); return; }
  if(act==='toggleform'){ dash.showForm=!dash.showForm; render(); if(dash.showForm){ const i=document.querySelector('#dispatch input'); if(i) i.focus(); } return; }
  if(act==='csv'){ try{ await downloadsApi.save({filename:'ziar-imaar-visits-'+new Date().toISOString().slice(0,10)+'.csv',data:toCsv()}); toast('CSV saved'); }catch(err){ if(!(err&&err.code==='declined')) toast('Could not export the CSV. Try again in a moment.'); } return; }
  if(act==='draftnote'){
    const ov=visits[office.id]; if(!ov) return;
    office.drafting=true; render();
    const bad=missingChecks(ov).map(c=>c.f);
    const prompt=`You help an office reviewer at a UAE technical-services company write a short review note to a field technician about a Kohler service visit.
Write 1 to 3 plain sentences addressed to the technician, saying exactly what to fix or add before the visit can be closed. If nothing needs fixing, write a one-sentence approval note. No greeting, no sign-off, no markdown.

Visit #${ov.id} at ${ov.site} (${ov.product}, ${ov.model}). Issue: ${ov.issue}.
Arrived ${hm(ov.arrived)||'not stamped'}, finished ${hm(ov.finished)||'not stamped'}. Outcome: ${ov.outcome||'not set'}.
Findings: ${ov.findings||'none'}. Work performed: ${ov.work||'none'}.
Technicians: ${ov.technician||'not named'}. Parts: ${(ov.parts||[]).map(p=>p.name+' x'+p.qty).join(', ')||'none'}. Evidence files: ${evItems(ov).length}. Customer signature: ${ov.signature?'yes':'no'}.
Required items still missing: ${bad.length?bad.join(', '):'none'}. Next action noted: ${ov.nextAction||'none'}. Return visit required: ${ov.returnVisit||'No'}.`;
    try{ const r=await sampleApi(prompt,{modelTier:'quick'}); office.note=((r&&r.text)||'').trim(); }
    catch(err){ const c=err&&err.code; if(c==='not_granted') sampleApi=null; else toast(c==='rate_limited'?'Too many drafts just now. Try again in a minute.':'Could not draft a note. Write it yourself or try again.'); }
    office.drafting=false; if(view==='office') render(); return;
  }
});

/* ---------- boot ---------- */
(()=>{ const h=location.hash.slice(1), ok=x=>['tech','office','dash'].includes(x); let saved=null; try{ saved=localStorage.getItem('zi-view'); }catch(e){} view=ok(h)?h:ok(saved)?saved:'tech'; })();

function goDemo(){ if(loaded) return; demo=true; loaded=true; visits=demoData(); render(); }

(async()=>{
  const fallback=setTimeout(goDemo,10000);
  const use=n=>window.claude&&window.claude.use?Promise.resolve(window.claude.use(n)).catch(()=>null):Promise.resolve(null);
  db=await use('db');
  if(!db){ clearTimeout(fallback); goDemo(); }
  // optional capabilities light up as they resolve
  use('user').then(async u=>{ userApi=u; if(!u) return; try{ const v=await u.me(); me={id:v.id||(u.id?await u.id():null),name:v.name||''}; }catch(e){} safeRender(); resolveNames(); });
  use('assets').then(a=>{ assets=a; safeRender(); });
  use('sample').then(s=>{ sampleApi=s; safeRender(); });
  use('downloads').then(d=>{ downloadsApi=d; safeRender(); });
  if(!db) return;
  db.collection('visits').onSnapshot(snap=>{
    clearTimeout(fallback); if(demo) return;
    const next={}; snap.docs.forEach(d=>{ const x=d.data(); if(x){ const v=Object.assign({id:d.id,history:[],parts:[],evidence:[]},x); if(!STATUS[v.status]) v.status=(v.history[v.history.length-1]||{}).status||'new'; next[d.id]=v; } });
    visits=next; loaded=true; safeRender(); resolveNames();
  },err=>{ clearTimeout(fallback); db=null; goDemo(); toast('Could not reach the shared store, showing demo data.'); });
})();
})();
