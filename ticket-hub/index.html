<title>Ziar Imaar Ticket Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: app shell — navy sidebar (desktop) / bottom tab bar (phone); light workspace; Tickets is a list + detail split. Deliberately light-only, Ziar Imaar navy & gold. */
:root{
  color-scheme:light;
  --bg:#f3f5f9; --surface:#ffffff; --surface2:#f8f9fc; --line:#e3e7ef; --line2:#cdd5e3;
  --ink:#0d1b3e; --ink2:#36425f; --muted:#67728c;
  --navy:#0a1f4d; --navy2:#13306b; --navy3:#1e4189; --navyInk:#c9d3ea;
  --gold:#c9972f; --goldInk:#7d5c12; --goldSoft:#fbf3df; --goldLine:#ecd6a0;
  --ok:#11734d; --okSoft:#e2f3ea; --warn:#9a5a06; --warnSoft:#fdf0d9; --bad:#b22a3d; --badSoft:#fbe7ea; --info:#1d5bb8; --infoSoft:#e7eefb; --orange:#b4501c; --orangeSoft:#fde9df;
  --s-new:#2a78d6; --s-recheck:#eb6834; --s-completed:#1baf7a; --s-review:#eda100; --s-cancelled:#e87ba4; /* validated categorical order, light surface */
  --bar:#23417f; --grid:#edf0f5;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; --display:Montserrat,Inter,system-ui,sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
  --r:12px; --shadow:0 1px 2px rgba(13,27,62,.06),0 4px 14px rgba(13,27,62,.05);
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--navy3)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-family:var(--display);letter-spacing:-.01em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sub{font-size:12.5px;color:var(--muted)}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.chip.new{background:var(--infoSoft);color:var(--info);border-color:transparent}
.chip.review{background:var(--goldSoft);color:var(--goldInk);border-color:transparent}
.chip.completed{background:var(--okSoft);color:var(--ok);border-color:transparent}
.chip.recheck{background:var(--orangeSoft);color:var(--orange);border-color:transparent}
.chip.cancelled{background:var(--badSoft);color:var(--bad);border-color:transparent}
.chip.sla-late{background:var(--badSoft);color:var(--bad);border-color:transparent}
.chip.sla-risk{background:var(--warnSoft);color:var(--warn);border-color:transparent}
.chip.sla-ok::before,.chip.plain::before{display:none}
.prio{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.prio.Urgent{color:var(--bad)}.prio.High{color:var(--warn)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--navy);color:#fff;display:flex;flex-direction:column;gap:26px;padding:22px 14px;position:sticky;top:0;height:100vh;height:100dvh}
.wm{display:flex;flex-direction:column;line-height:1;padding:0 8px}
.wm b{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.07em;display:flex;align-items:center;gap:7px;color:#fff}
.wm b i{display:inline-block;width:18px;height:2px;background:var(--gold);border-radius:2px}
.wm small{font-family:var(--display);font-weight:500;font-size:8px;letter-spacing:.34em;color:var(--navyInk);margin-top:5px}
.client{margin:0 8px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.06);font-size:12px;color:var(--navyInk);line-height:1.35}
.client b{display:block;color:#fff;font-size:13px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;height:40px;padding:0 12px;border-radius:9px;color:var(--navyInk);font-weight:500;text-align:left;position:relative}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current="page"]{background:var(--navy2);color:#fff;font-weight:600}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav .badge{margin-left:auto}
.nav .ngrp{display:flex;flex-direction:column;gap:1px;margin-bottom:2px}
.nav .nsec{font-weight:600;font-size:13.5px}
.nav .nsec small{opacity:.55;font-weight:600;font-size:10.5px;margin-right:2px}
.nav .nsec .chev{margin-left:auto;font-style:normal;opacity:.6;font-size:11px}
.nav .ngrp.cur .nsec{color:#fff}
.nav .nitems{display:flex;flex-direction:column;gap:1px;margin:0 0 6px 0}
.nav .nitems button{height:34px;padding-left:40px;font-size:13px}
.nav .soon{margin-left:auto;font-size:10px;letter-spacing:.04em;text-transform:uppercase;opacity:.55;border:1px solid currentColor;border-radius:4px;padding:0 4px}
.side{overflow-y:auto}
.side>*{flex-shrink:0}
.nav .gsbtn{display:flex;align-items:center;gap:10px;height:38px;margin:0 0 10px;padding:0 12px;border-radius:9px;background:rgba(255,255,255,.08);color:var(--navyInk);font-weight:500}
.nav .gsbtn:hover{background:rgba(255,255,255,.14);color:#fff}
.nav .gsbtn kbd{margin-left:auto;font-size:10.5px;opacity:.65;font-family:inherit;border:1px solid currentColor;border-radius:4px;padding:0 5px}
#gsearch .gs-box{position:fixed;left:50%;top:10vh;transform:translateX(-50%);width:min(640px,calc(100vw - 32px));max-height:72vh;display:flex;flex-direction:column;background:var(--surface);border-radius:14px;box-shadow:0 24px 64px rgba(10,20,40,.35);z-index:82;overflow:hidden}
#gsearch .gs-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);color:var(--muted)}
#gsearch .gs-in input{flex:1;border:0;outline:0;font:inherit;font-size:16px;background:transparent;color:var(--ink);min-width:0}
#gsearch .gs-in kbd{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-family:inherit}
#gsearch .gs-res{overflow-y:auto;padding:6px 0}
#gsearch .gs-g{padding:10px 16px 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#gsearch .gs-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:8px 16px;text-align:left}
#gsearch .gs-item.on,#gsearch .gs-item:hover{background:var(--goldSoft)}
#msheet .msheet-bg{position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:80}
#msheet .msheet{position:fixed;left:0;right:0;bottom:0;max-height:85vh;overflow-y:auto;background:var(--navy);color:#fff;border-radius:16px 16px 0 0;padding:12px 14px calc(18px + env(safe-area-inset-bottom,0px));z-index:81}
#msheet .msheet-h{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 10px}
#msheet .msheet-h .btn{color:#fff}
#msheet .nav button[aria-current="page"]::before{display:none}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--gold);color:var(--navy);font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.newbtn{height:42px;border-radius:10px;background:var(--gold);color:var(--navy);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;margin:0 2px}
.newbtn:hover{filter:brightness(1.05)}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.1)}
.me{display:flex;align-items:center;gap:10px;font-size:13px;color:#fff;min-width:0}
.me span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--navy);background:var(--gold);flex:none}
.mode{font-size:11.5px;color:var(--navyInk);display:flex;align-items:center;gap:6px}
.mode::before{content:"";width:7px;height:7px;border-radius:50%;background:#4fd1a1}
.mode.demo::before{background:var(--gold)}
.mode.wait::before{background:var(--navyInk)}
.mode.off::before{background:#f2716b}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.tabbar{display:none}

/* ---------- page scaffolding ---------- */
.page{padding-block:26px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));max-width:1440px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.phead h1{font-size:26px;font-weight:700}
.phead .sub{margin-top:4px;font-size:13.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:38px;border-radius:9px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:13.5px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--navy3)}
.btn.danger{color:var(--bad)}
.btn.ai{border-style:dashed;border-color:var(--goldLine);background:var(--goldSoft);color:var(--goldInk)}
.btn.block{width:100%}
.btn.lg{height:46px;font-size:14.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:14.5px;font-weight:600}
.card-b{padding:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-size:13px;color:var(--ink2);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.tabs button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.tabs button .c{font-size:11px;opacity:.75}
.field{display:block;width:100%;margin-top:6px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);padding:10px 12px;color:var(--ink);resize:vertical}
.field::placeholder{color:#97a0b5}
.field:focus{border-color:var(--navy3);outline:none;box-shadow:0 0 0 3px rgba(30,65,137,.12)}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.search{position:relative;flex:1 1 220px;max-width:360px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .field{margin:0;padding-left:34px;height:38px}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.fgrid label,.flabel{display:flex;flex-direction:column;font-size:12.5px;color:var(--ink2);font-weight:600;min-width:0}
.fgrid .field{margin-top:5px}
.span2{grid-column:span 2}.span4{grid-column:1/-1}
.empty{color:var(--muted);padding:28px 16px;text-align:center;font-size:13.5px}
.err{color:var(--bad);font-size:12.5px;min-height:16px}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi b{font-family:var(--display);font-size:28px;font-weight:700;color:var(--navy);line-height:1.15;font-variant-numeric:tabular-nums}
.kpi.hero{background:var(--navy);border-color:var(--navy);color:#fff}
.kpi.hero .lbl{color:var(--navyInk)}.kpi.hero b{color:#fff}.kpi.hero .sub{color:var(--navyInk)}
.kpi.alert b{color:var(--bad)}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface2);gap:2px}
.stack span{display:block;height:100%;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.dgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.chart .cap{font-size:12px;color:var(--muted);margin-top:2px}
.colplot{position:relative;height:190px;margin-left:28px}
.colplot .gl{position:absolute;left:0;right:0;border-top:1px solid var(--grid)}
.colplot .gl span{position:absolute;left:-28px;top:-8px;width:22px;text-align:right;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cols{position:absolute;inset:0;display:flex;align-items:flex-end;gap:2px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
.col i{display:block;width:min(64%,34px);background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}
.col:hover i,.col:focus-visible i{background:var(--navy3)}
.col b{position:absolute;font-size:11px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.colx{display:flex;gap:2px;margin-left:28px;margin-top:6px}
.colx span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 3em;gap:10px;align-items:center;font-size:13px}
.hb .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.hb .t{height:10px;background:var(--surface2);border-radius:0 4px 4px 0;overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
details.tv{margin-top:8px}
details.tv summary{cursor:pointer;font-size:12px;color:var(--muted)}
details.tv table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}
details.tv td,details.tv th{padding:4px 8px;text-align:left;border-top:1px solid var(--line)}
.attn{display:flex;flex-direction:column}
.attn button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);text-align:left;width:100%}
.attn button:first-child{border-top:0}
.myjobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:16px}
.myjob{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--navy3);border-radius:14px;padding:14px;display:grid;gap:8px;min-width:0}
.myjob.late{border-left-color:var(--bad)}.myjob.done{border-left-color:var(--ok);opacity:.75}
.myjob .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.myjob .t b{font-size:18px}
.myjob .site{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.myjob .acts{display:flex;gap:8px;flex-wrap:wrap}.myjob .acts>*{flex:1 1 auto;justify-content:center;text-align:center;text-decoration:none}
.attn button:hover{background:var(--surface2)}
.attn .idn{font-weight:700;font-variant-numeric:tabular-nums;color:var(--navy)}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--navy);color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;max-width:240px;box-shadow:0 6px 18px rgba(13,27,62,.25)}

/* ---------- tickets split ---------- */
.split{display:grid;grid-template-columns:minmax(330px,420px) minmax(0,1fr);gap:16px;align-items:start}
.listpane{display:flex;flex-direction:column;overflow:hidden;position:sticky;top:16px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px)}
.listtools{padding:12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.listtools .search{max-width:none;flex:none}
.tlist{overflow:auto;flex:1}
.titem{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;width:100%;position:relative}
.titem:hover{background:var(--surface2)}
.titem[aria-current="true"]{background:var(--goldSoft)}
.titem[aria-current="true"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.titem .top{display:flex;align-items:center;gap:8px}
.titem .idn{font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.titem .site{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titem .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.groupl{padding:10px 14px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface2);border-bottom:1px solid var(--line)}
.groupl.late{color:var(--bad)}
.more{padding:12px}
.detail{min-width:0;display:flex;flex-direction:column;gap:16px}
.dhead{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.dhead h2{font-size:22px;font-weight:700}
.dhead .chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.backlink{display:none}
.info{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.info>div{background:var(--surface);padding:12px 16px;min-width:0}
.info>div div:last-child{margin-top:2px;overflow-wrap:anywhere;font-weight:500}
.info .wide{grid-column:span 2}
.quick{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.callbox{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:6px 6px 6px 12px}
.banner{border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:flex-start;font-size:13.5px;flex-wrap:wrap}
.banner b{display:block;margin-bottom:2px}
.banner.warn{background:var(--orangeSoft);color:#6a2d0c;border:1px solid #f6c9b0}
.banner.gold{background:var(--goldSoft);color:#5a420c;border:1px solid var(--goldLine)}
.banner.ok{background:var(--okSoft);color:#0b4d34;border:1px solid #b9e2cd}
.banner.bad{background:var(--badSoft);color:#6e1824;border:1px solid #f2c0c8}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.step{display:flex;flex-direction:column;gap:6px;padding:14px 16px;text-align:left;border-right:1px solid var(--line);position:relative;min-width:0}
.step:last-child{border-right:0}
.step:hover{background:var(--surface2)}
.step .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid var(--line2);color:var(--muted);background:var(--surface)}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.step.cur{background:var(--goldSoft)}
.step.cur .dot{border:2px solid var(--gold);color:var(--goldInk)}
.step .t{font-weight:600}
.step .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .go{font-size:12px;font-weight:700;color:var(--goldInk)}
.submitbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.sections{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.prose{display:flex;flex-direction:column;gap:14px}
.prose p{margin:3px 0 0;white-space:pre-wrap}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.kv:first-child{border-top:0}
.kv span:first-child{color:var(--muted)}

/* ---------- authenticator codes (TOTP, RFC 6238: SHA-1, 6 digits, 30 s) ---------- */
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
const b32enc=bytes=>{let bits=0,val=0,out='';for(const b of bytes){val=(val<<8)|b;bits+=8;while(bits>=5){out+=B32[(val>>>(bits-5))&31];bits-=5;}val&=(1<<bits)-1;}if(bits>0)out+=B32[(val<<(5-bits))&31];return out;};
const b32dec=s=>{s=String(s).replace(/[\s=]+/g,'').toUpperCase();let bits=0,val=0;const out=[];for(const c of s){const i=B32.indexOf(c);if(i<0)continue;val=(val<<5)|i;bits+=5;if(bits>=8){out.push((val>>>(bits-8))&255);bits-=8;}val&=(1<<bits)-1;}return new Uint8Array(out);};
async function totpAt(secret,counter){const key=await crypto.subtle.importKey('raw',b32dec(secret),{name:'HMAC',hash:'SHA-1'},false,['sign']);const buf=new ArrayBuffer(8);const dv=new DataView(buf);dv.setUint32(0,Math.floor(counter/4294967296));dv.setUint32(4,counter>>>0);const h=new Uint8Array(await crypto.subtle.sign('HMAC',key,buf));const o=h[19]&15;const n=((h[o]&127)<<24)|(h[o+1]<<16)|(h[o+2]<<8)|h[o+3];return String(n%1000000).padStart(6,'0');}
async function totpCheck(secret,code,last){ const c=Math.floor(Date.now()/30000); for(const d of [0,-1,1]){ const k=c+d; if(last&&k<=last) continue; if(await totpAt(secret,k)===code) return k; } return null; }

// Admin = the owner or anyone with Editor access (the store enforces role and audit permissions); Office and Technician are assigned by an admin.
function access(){
  if(demo||!db) return 'admin';
  if(canEditLvl===null||!rolesLoaded) return 'loading';
  if(canEditLvl) return 'admin';
  const r=me.id&&roles[me.id]; return r&&PERMS[r.role]?r.role:'none';
}
const can=r=>{ const a=access(); return !!(PERMS[a]&&PERMS[a].includes(r)); };
const isOffice=()=>['admin','office'].includes(access());
// who may change a ticket: office and admins any ticket, technicians only tickets assigned to them, viewers none
const canEditTicket=v=>{ const a=access(); return a==='admin'||a==='office'||(a==='technician'&&!!me.id&&v.assignedTo===me.id); };
// each person appends to their own audit record (audit/<their id>); the store lets nobody else, the owner included, change it, and only admins read others' records
let auditChain=Promise.resolve();
function logAction(action,data={}){
  if(!db||!uid()) return;
  const e=Object.assign({at:new Date().toISOString(),action,role:access()},data);
  auditChain=auditChain.then(async()=>{ const ref=db.doc('audit/'+uid()); const sn=await ref.get(); const prev=(sn.exists&&Array.isArray((sn.data()||{}).entries))?sn.data().entries:[]; await ref.set({entries:[...prev,e].slice(-500)}); }).catch(()=>{});
}

function sla(v){
  const hrs=SLA_HOURS[v.priority||'Normal']||72;
  const due=new Date(new Date(createdAt(v)).getTime()+hrs*3600000);
  const sched=new Date(v.scheduled);
  const target=sched>due?sched:due;   // a visit booked later than the SLA, at the customer's request, follows the booking
  if(v.status==='cancelled'||!v.scheduled||((v.status==='completed'||v.status==='review')&&!v.arrived)) return {cls:'sla-ok',label:'—',late:false};
  if(v.arrived){ const late=new Date(v.arrived)>target; return {cls:late?'sla-late':'sla-ok',label:late?'SLA missed':'SLA met',late}; }
  const left=(target-Date.now())/3600000;
  if(left<0) return {cls:'sla-late',label:'Overdue '+dur(-left*60),late:true,lateH:-left};
  if(left<6) return {cls:'sla-risk',label:'Due in '+dur(left*60),late:false};
  return {cls:'sla-ok',label:'Due '+dm(target.toISOString()),late:false};
}
// escalation: L1 overdue up to 24 h (technician), L2 24–72 h (office supervisor), L3 over 72 h (administrator)
function escal(v){ if(!editable(v)) return null; const s=sla(v); if(!s.late) return null; const L=s.lateH>72?3:s.lateH>24?2:1; return {L,to:ESC_TO[L],label:'L'+L+' · '+s.label}; }

const assigneeName=v=>v.assignedTo?(nameOf(v.assignedTo)||'Technician'):'';
const slaChip=v=>{ const e=escal(v); if(e) return `<span class="chip sla-late">${esc(e.label)}</span>`; 
  const _s=0;
  return slaChip0(v); };
const slaChip0=v=>{ const s=sla(v); return s.label==='—'?'':`<span class="chip ${s.cls}">${esc(s.label)}</span>`; };
function checks(v){
  return [
    {f:'Work performed',ok:!!(v.work||'').trim(),val:(v.work||'').trim()?'Recorded':'—',req:true},
    {f:'Time in / out',ok:!!(v.arrived&&v.finished),val:v.arrived?hm(v.arrived)+' – '+(hm(v.finished)||'not stamped'):'—',req:true},
    {f:'Outcome',ok:!!v.outcome,val:v.outcome||'—',req:true},
    {f:'Technicians',ok:!!(v.technician||'').trim(),val:v.technician||'—',req:true},
    {f:'Z Invoice No.',ok:!!(v.billingRef||'').trim(),val:v.billingRef||(autoNumOn()?'Assigned at billing':'—'),req:!autoNumOn()},
    {f:'Photos / documents',ok:evItems(v).length>0,val:evidenceLabel(v),req:false},
    {f:'Customer sign-off',ok:!!v.signature,val:v.signature?(v.signerName||'Signed'):'—',req:false},
  ];
}
const missingChecks=v=>checks(v).filter(c=>c.req&&!c.ok);
const flagSummary=v=>{ const b=missingChecks(v); return !b.length?'Ready to close':b.length===1?b[0].f+' missing':b.length+' items missing'; };

async function save(v,action){
  v.updatedAt=new Date().toISOString();
  if(action) logAction(action,{ticket:v.id});
  visits[v.id]=clone(v);
  render();
  if(db){
    try{ await dbWrite('visits',v.id,clone(v)); }
    catch(e){ const c=e&&e.code; toast(c==='not_granted'||c==='permission_denied'||c==='forbidden'?'You can view this hub but not change it. Ask the owner for edit access.':'Could not save. Check your connection and try again.'); }
  }
}

async function resolveNames(){

  const ids=new Set(); Object.values(visits).forEach(v=>(v.history||[]).forEach(h=>h.by&&ids.add(h.by))); Object.values(parts).forEach(p=>p.by&&ids.add(p.by)); Object.keys(roles).forEach(i=>ids.add(i)); Object.keys(requests).forEach(i=>ids.add(i)); audit.forEach(e=>e.by&&ids.add(e.by)); Object.values(roles).forEach(r=>r.by&&ids.add(r.by));

/* ---------- Data quality ---------- */
function qualityIssues(){
  const V=Object.values(visits), out=[];
  const add=(t,d,list)=>{ if(list.length) out.push({t,d,list}); };
  add('Marked New but work is already recorded','Has arrival time or work notes. Submit it for review or correct the status.',V.filter(v=>v.status==='new'&&(v.arrived||(v.work||'').trim())));
  add('No visit date','The ticket has no scheduled date.',V.filter(v=>!v.scheduled&&v.status!=='cancelled'));
  add('Emirate not on the rate card','The ticket cannot be priced.',V.filter(v=>v.status!=='cancelled'&&rateRows()&&ticketCharge(v).missing));
  add('Completed but not invoiced','No Z invoice number yet.',V.filter(v=>v.status==='completed'&&!(v.billingRef||'').trim()&&billKindOf(v)!=='none'));
  add('Completed without in/out times','Time in and out were not stamped.',V.filter(v=>v.status==='completed'&&!(v.arrived&&v.finished)));
  add('Completed without a technician','No technician name recorded.',V.filter(v=>v.status==='completed'&&!(v.technician||'').trim()));
  add('Cancelled but has an invoice number','A cancelled ticket should not be billed.',V.filter(v=>v.status==='cancelled'&&(v.billingRef||'').trim()));

function aedWords(n){
  const o=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'], t=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const h=x=>{ let s=''; if(x>=100){ s+=o[Math.floor(x/100)]+' Hundred'; x%=100; if(x) s+=' '; } if(x>=20){ s+=t[Math.floor(x/10)]; if(x%10) s+=' '+o[x%10]; } else if(x) s+=o[x]; return s; };
  const w=x=>{ if(!x) return 'Zero'; const parts=[]; [[1e9,'Billion'],[1e6,'Million'],[1e3,'Thousand']].forEach(([d,l])=>{ if(x>=d){ parts.push(h(Math.floor(x/d))+' '+l); x%=d; } }); if(x) parts.push(h(x)); return parts.join(' '); };
  const a=Math.abs(r2(n)), d=Math.floor(a), f=Math.round((a-d)*100);
  return 'UAE Dirhams '+w(d)+(f?' and '+w(f)+' Fils':'')+' only (AED '+(f?a.toFixed(2):d)+')';
}
function invRows(inv){
  if(isCredit(inv)) return [{d:'Credit against invoice '+(inv.refInvoice||'')+(inv.notes?' — '+inv.notes:''),q:1,u:-inv.net}];

  const ref=id=>(visits[id]&&visits[id].ref)||('EZR-KOHLER-SRV-26-'+id), site=id=>String((visits[id]||{}).site||'').split('|')[0].trim().toLowerCase();
  const col={}, wait=[], svc={}, rows=[];
  L.forEach(l=>{ if(l.collection){ const k=l.emirate+'|'+l.collection; (col[k]=col[k]||{em:l.emirate,u:l.collection,n:0}).n++; } if(l.waiting) wait.push(l); if(l.service){ const k=site(l.ticket)+'|'+l.service; (svc[k]=svc[k]||{u:l.service,ids:[]}).ids.push(l.ticket); } });
  Object.values(col).forEach(c=>rows.push({o:0,d:'Spare Collection - Transportation Charges - '+c.em,q:c.n,u:c.u}));
  const singles=[];
  Object.values(svc).forEach(g=>{ const ids=g.ids.sort(), runs=[]; let r=[ids[0]]; ids.slice(1).forEach(id=>{ if(+id===+r[r.length-1]+1) r.push(id); else { runs.push(r); r=[id]; } }); runs.push(r);

    multi.forEach(x=>rows.push({o:1,u:g.u,first:x[0],q:x.length,d:'Ticket No-'+ref(x[0])+(x.length===2?' & ':' to ')+ref(x[x.length-1])}));
    if(lone.length===1&&!multi.length) rows.push({o:1,u:g.u,first:lone[0][0],q:1,d:'Ticket No-'+ref(lone[0][0])});

/* ---------- real-time sync: status, offline queue, team change notices ---------- */
let lastSync=null, syncQ=[], syncBusy=false; const mineRecent={};
try{ syncQ=JSON.parse(localStorage.getItem('zi-queue')||'[]')||[]; }catch(e){ syncQ=[]; }
const saveQ=()=>{ try{ localStorage.setItem('zi-queue',JSON.stringify(syncQ)); }catch(e){} };
const netErr=e=>{ const c=e&&e.code; return !navigator.onLine||!c||['unavailable','server_unavailable','network','timeout','upstream_error','deadline-exceeded','rate_limited'].includes(c); };
function queueW(col,id,data){ syncQ=syncQ.filter(q=>!(q.col===col&&q.id===id)); syncQ.push({col,id,data,at:Date.now(),tries:0}); saveQ(); toast('Saved on this device — it will sync when the connection is back'); navHtml(); }
async function dbWrite(col,id,data){
  mineRecent[col+'/'+id]=Date.now(); if(!db) return;
  if(!navigator.onLine){ queueW(col,id,data); return; }
  try{ if(data===null) await db.doc(col+'/'+id).delete(); else await db.doc(col+'/'+id).set(data); }
  catch(e){ if(netErr(e)){ queueW(col,id,data); return; } throw e; }
}
async function flushQ(){
  if(syncBusy||!db||!syncQ.length||!navigator.onLine) return; syncBusy=true; let done=0;
  try{ for(const q of [...syncQ]){ try{ mineRecent[q.col+'/'+q.id]=Date.now(); if(q.data===null) await db.doc(q.col+'/'+q.id).delete(); else await db.doc(q.col+'/'+q.id).set(q.data); syncQ=syncQ.filter(x=>x!==q); done++; }
      catch(e){ if(netErr(e)&&++q.tries<20) break; syncQ=syncQ.filter(x=>x!==q); toast('One offline change could not be saved. You may not have access to change it.'); } saveQ(); }
    if(done&&!syncQ.length) toast('Back online — '+done+' change'+(done>1?'s':'')+' synced'); }
  finally{ syncBusy=false; navHtml(); }
}
function overlayQ(col,store){ syncQ.filter(q=>q.col===col).forEach(q=>{ if(q.data===null) delete store[q.id]; else store[q.id]=Object.assign({id:q.id},q.data); }); }
window.addEventListener('online',()=>{ navHtml(); flushQ(); }); window.addEventListener('offline',()=>navHtml()); setInterval(()=>{ flushQ(); navHtml(); },30000);
function syncLabel(){ if(!loaded) return ['Connecting…','wait']; if(demo) return ['Demo mode · changes stay in this tab','demo'];
  if(!navigator.onLine) return ['Offline'+(syncQ.length?' · '+syncQ.length+' change'+(syncQ.length>1?'s':'')+' waiting':' · showing the last data'),'off'];
  if(syncQ.length) return ['Syncing '+syncQ.length+' change'+(syncQ.length>1?'s':'')+'…','wait'];

/* billing day: for 5 days after a cycle closes (15th and month end), show the statement, the cycle's invoices and what is overdue */

function stepsCard(v){

    ['visit','Complete visit',v.arrived?('In '+hm(v.arrived)+(v.finished?' · out '+hm(v.finished):'')):'Times, findings, photos, sign-off'],
    ['parts','Parts used',partsCount(v)+' part'+(partsCount(v)===1?'':'s')],

function detailHtml(v){

const invKey=x=>String(x||'').replace(/[\s\-_]/g,'').toUpperCase();

const invPaid=i=>isCredit(i)?0:r2(Object.values(bankTx).filter(t=>t.invoiceNo&&invKey(t.invoiceNo)===invKey(i.invoiceNo)&&+t.amount>0).reduce((a,t)=>a+(+t.amount),0)+(+i.paidOther||0)+creditsFor(i));
function invoiceState(i){ if(isCredit(i)) return i.status==='void'?{k:'void',label:'Void',cls:'cancelled'}:{k:'credit',label:'Credit note · '+(i.refInvoice||''),cls:'plain'}; if(i.status==='void') return {k:'void',label:'Void',cls:'cancelled'}; if(i.status==='draft') return {k:'draft',label:'Draft',cls:'plain'}; const g=invGross(i), p=invPaid(i); if(!g) return {k:'noamt',label:'Amount missing',cls:'sla-risk'}; if(p>=g-0.005) return {k:'paid',label:'Paid',cls:'completed'}; if(i.dueDate&&new Date(i.dueDate+'T23:59:59+04:00')<new Date()) return {k:'overdue',label:p>0?'Part paid · overdue':'Overdue',cls:'sla-late'}; return {k:'open',label:p>0?'Part paid':'Issued',cls:'review'}; }

const acctBal=(a,upto)=>r2((+a.opening||0)+acctTx(a.id).filter(t=>!upto||t.date<=upto).reduce((s,t)=>s+(+t.amount||0),0));

const quarterOf=d=>{ const m=+d.slice(5,7); return d.slice(0,4)+'-Q'+Math.ceil(m/3); };
function finTotals(){

  const cash=Object.values(bankAccounts).reduce((s,a)=>s+acctBal(a),0);

  const q=quarterOf(new Date(Date.now()+4*3600000).toISOString().slice(0,10));
  const outV=inv.filter(i=>i.date&&quarterOf(i.date)===q).reduce((s,i)=>s+(+i.vat||0),0), inV=tx.filter(t=>t.date&&quarterOf(t.date)===q).reduce((s,t)=>s+(+t.vat||0),0);

const CAT_RULES=[[/adnoc|enoc|eppco|emarat|petrol|fuel|salik|parking|rta|careem|uber|taxi/,'Transport & fuel'],[/salary|salaries|wps|payroll|wages/,'Salaries & wages'],[/charge|fee|commission|vat on fee|service chg/,'Bank charges'],[/dewa|sewa|addc|fewa|rent|ejari/,'Rent & utilities'],[/etisalat|\bdu\b|e&|internet|mobile/,'Telephone & internet'],[/visa|immigration|gdrfa|amer|tasheel|mohre|labour|tawjeeh|emirates id|license|licence|ded\b/,'Government, visa & licence'],[/fta|vat return|vat payment/,'VAT payment'],[/transfer to own|own account|internal transfer|trf to|transfer from/,'Transfer between accounts'],[/hardware|ace |danube|plumbing|electrical|spare|material/,'Parts & materials']];
const descKey=d=>String(d||'').toLowerCase().replace(/[0-9]+/g,' ').replace(/[^a-z ]/g,' ').split(/\s+/).filter(Boolean).slice(0,3).join(' ');
function guessTx(t){
  const d=String(t.desc||'').toLowerCase(), out={};
  if(+t.amount>0){
    const m=String(t.desc+' '+(t.ref||'')).toUpperCase().match(/Z?RA[\s\-_]?\d{3,5}/g)||[]; const hit=m.map(x=>Object.values(invoices).find(i=>invKey(i.invoiceNo)===invKey(x))).find(Boolean);
    const open=Object.values(invoices).filter(i=>['open','overdue'].includes(invoiceState(i).k)&&Math.abs(invGross(i)-invPaid(i)-(+t.amount))<0.01);
    const inv=hit||(open.length===1?open[0]:null);
    if(inv){ out.invoiceNo=inv.invoiceNo; out.category='Customer receipt'; return out; }
    if(/easy renovation|kohler/.test(d)){ out.category='Customer receipt'; return out; }
  }
  if(+t.amount<0){ const ob=openBills().filter(b=>Math.abs(billTotal(b)-billPaid(b)+(+t.amount))<0.01); if(ob.length===1){ out.billNo=ob[0].billNo; out.category='Supplier bill payment'; return out; } }
  const learnt=Object.values(bankTx).filter(x=>x.category&&x.category!=='Uncategorised'&&x.id!==t.id&&descKey(x.desc)===descKey(t.desc)&&Math.sign(+x.amount)===Math.sign(+t.amount)).sort((a,b)=>(b.at||'').localeCompare(a.at||''))[0];
  if(learnt&&descKey(t.desc)){ out.category=learnt.category; return out; }
  const r=CAT_RULES.find(([re])=>re.test(d)); if(r&&(+t.amount<0||r[1]==='Transfer between accounts')) out.category=r[1];
  return out;
}
async function autoSort(){

    const g=guessTx(t); if(t.category&&t.category!=='Uncategorised') delete g.category; if(!Object.keys(g).length) continue; const d=Object.assign({},t,g,{autoSorted:true}); delete d.id; await saveDoc('bankTx',t.id,d,bankTx); bankTx[t.id]=Object.assign({id:t.id},d); n++; if(g.invoiceNo) m++; }
  logAction('Sorted bank lines automatically',{detail:n+' lines, '+m+' matched to invoices'}); toast(n?n+' line'+(n>1?'s':'')+' sorted'+(m?', '+m+' matched to invoices':''):'Nothing more could be sorted automatically — pick a category on the remaining lines once and the hub will learn it.');
}

/* ---------- monthly trend, repeating bills, corporate tax ---------- */
function glTrend(E,from,to){
  const months=[]; let m=from.slice(0,7); while(m<=to.slice(0,7)&&months.length<24){ months.push(m); m=nextMonth(m); } if(months.length<2) return '';
  const data=months.map(mm=>{ const B=glBalances(E,mm+'-01',monthEnd(mm)); let inc=0, exp=0; chart().forEach(a=>{ if(!B[a[0]]) return; if(a[2]==='income') inc+=natural(a[0],B[a[0]]); if(a[2]==='expense') exp+=natural(a[0],B[a[0]]); }); return {m:mm,inc:r2(inc),exp:r2(exp),net:r2(inc-exp)}; });
  const mx=Math.max(1,...data.flatMap(d=>[d.inc,d.exp])), W=Math.max(320,data.length*58), H=190, pb=28, pt=14, ch=H-pb-pt, bw=Math.min(18,(W/data.length-14)/2);
  const y=v=>pt+ch-(Math.max(0,v)/mx)*ch;
  const bars=data.map((d,i)=>{ const cx=(i+.5)*(W/data.length); return `<g><title>${esc(mlab(d.m))}: income ${esc(money(d.inc))}, expenses ${esc(money(d.exp))}, profit ${esc(money(d.net))}</title><rect x="${cx-bw-1}" y="${y(d.inc)}" width="${bw}" height="${pt+ch-y(d.inc)}" rx="3" fill="var(--s-completed)"/><rect x="${cx+1}" y="${y(d.exp)}" width="${bw}" height="${pt+ch-y(d.exp)}" rx="3" fill="var(--bar)"/><text x="${cx}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(MON[+d.m.slice(5)-1])}</text></g>`; }).join('');
  const line=data.map((d,i)=>`${(i+.5)*(W/data.length)},${y(Math.max(0,d.net))}`).join(' ');
  return `<div class="card"><div class="card-h"><div><h3>Month by month</h3><div class="sub">Income and expenses before VAT · the line is profit</div></div><div class="legend"><span><i style="background:var(--s-completed)"></i>Income</span><span><i style="background:var(--bar)"></i>Expenses</span><span><i style="background:var(--gold)"></i>Profit</span></div></div>
   <div class="card-b" style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H+40}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Monthly income, expenses and profit" style="display:block;min-width:${Math.min(W,560)}px"><line x1="0" x2="${W}" y1="${pt+ch}" y2="${pt+ch}" stroke="var(--line)"/>${bars}<polyline points="${line}" fill="none" stroke="var(--gold)" stroke-width="2.5"/>${data.map((d,i)=>`<circle cx="${(i+.5)*(W/data.length)}" cy="${y(Math.max(0,d.net))}" r="3.5" fill="var(--gold)"/>`).join('')}</svg>
   <details style="margin-top:8px"><summary class="sub" style="cursor:pointer">Show as table</summary><div class="tblwrap"><table class="tbl"><thead><tr><th>Month</th><th class="amt">Income</th><th class="amt">Expenses</th><th class="amt">Profit</th></tr></thead><tbody>${data.map(d=>`<tr><td>${esc(mlab(d.m))}</td>${amtCell(d.inc)}${amtCell(d.exp)}${amtCell(d.net)}</tr>`).join('')}</tbody></table></div></details></div></div>`;
}
/* repeating bills: the newest bill of a series is copied each month on its day */
async function repeatBills(){
  const t=todayDxb(), series={}; let made=0;
  Object.values(bills).filter(b=>b.repeat&&b.repeat.day).forEach(b=>{ const k=b.series||b.id; if(!series[k]||(b.date||'')>(series[k].date||'')) series[k]=b; });
  for(const last of Object.values(series)){ if(last.repeat.stopped) continue; let cur=last;
    for(let n=0;n<12;n++){ const nm=nextMonth(cur.date.slice(0,7)), day=Math.min(+cur.repeat.day,+monthEnd(nm).slice(8)), date=nm+'-'+String(day).padStart(2,'0'); if(date>t) break;
      const no=(last.billNo||'').replace(/-\d{6}$/,'')+'-'+nm.replace('-',''); if(Object.values(bills).some(b=>(b.series||b.id)===(last.series||last.id)&&b.date===date)) { cur={...cur,date}; continue; }
      const d={...last,date,dueDate:addDays(date,Math.max(0,Math.round((new Date((last.dueDate||last.date)+'T00:00:00Z')-new Date(last.date+'T00:00:00Z'))/864e5))),billNo:no,paidOther:0,paidDate:'',series:last.series||last.id,auto:true,notes:'Repeats monthly'+(last.notes?' · '+last.notes:''),at:new Date().toISOString()}; delete d.id;
      if(await saveDoc('bills',newId('b'),d,bills)===false) break; made++; cur={...d}; } }
  if(made) logAction('Repeating bills created',{detail:made+' bill(s)'});
  return made;
}

function glCT(E){

  const B=glBalances(E,start,end); let inc=0, exp=0; chart().forEach(a=>{ if(!B[a[0]]) return; if(a[2]==='income') inc+=natural(a[0],B[a[0]]); if(a[2]==='expense') exp+=natural(a[0],B[a[0]]); });
  inc=r2(inc); exp=r2(exp); const prof=r2(inc-exp), adj=r2(+s.ctAdjust||0), taxable=r2(prof+adj), base=r2(Math.max(0,taxable-375000)), tax=r2(base*0.09), sbr=inc<=3000000&&end<='2026-12-31';
  const due=addDays(addDays(end,1).slice(0,7)+'-01',0), dueDate=(()=>{ let m=end.slice(0,7); for(let k=0;k<9;k++) m=nextMonth(m); return monthEnd(m); })();

   <div class="tblwrap"><table class="tbl"><tbody>${r('Revenue (from the accounts)',inc)}${r('Expenses',-exp)}${r('Accounting profit',prof,true)}
    <tr><td>Adjustments your accountant gives you (non-deductible costs, exempt income…)</td><td class="amt"><input id="ct-adj" class="field" type="number" step="0.01" value="${adj||''}" placeholder="0" style="height:32px;width:130px;text-align:right;margin-left:auto;display:block"></td></tr>
    ${r('Taxable income',taxable,true)}${r('Less: 0% band (first AED 375,000)',-Math.min(375000,Math.max(0,taxable)))}${r('Taxed at 9%',base)}
    <tr style="font-weight:700;font-size:15px"><td style="border-top:2px solid var(--line)">Estimated Corporate Tax</td><td class="amt" style="border-top:2px solid var(--line)">${esc(money(tax))}</td></tr></tbody></table></div>
   <div class="card-b" style="display:grid;gap:8px">
    ${sbr?`<div class="notice">Revenue is at or below AED 3,000,000, so the company may be able to elect <b>Small Business Relief</b> for this period, which would make the tax AED 0. The relief applies to tax periods ending on or before 31 December 2026.</div>`:''}
    <div class="sub" style="font-size:12.5px">Return and payment due by <b>${esc(fdx(dueDate))}</b> (9 months after the year end). This uses the hub's management accounts and the standard 0% / 9% rates; your accountant must confirm the taxable income, registration and any reliefs before you file on EmaraTax.</div></div></div>`;
}

/* ---------- signature pad ---------- */
function initSig(){
  const c=document.getElementById('sigpad'); if(!c||!draft) return;
  const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr);
  const ctx=c.getContext('2d'); ctx.scale(dpr,dpr); ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0d1b3e';
  if(draft.signature){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,r.width,r.height); img.src=draft.signature; }
  let drawing=false, last=null;
  const pt=e=>{ const b=c.getBoundingClientRect(); return {x:e.clientX-b.left,y:e.clientY-b.top}; };
  c.addEventListener('pointerdown',e=>{ drawing=true; last=pt(e); try{ c.setPointerCapture(e.pointerId); }catch(_){} const ph=c.parentElement.querySelector('.ph'); if(ph) ph.remove(); e.preventDefault(); });
  c.addEventListener('pointermove',e=>{ if(!drawing) return; const p=pt(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; });
  const end=()=>{ if(!drawing) return; drawing=false; draft.signature=c.toDataURL('image/png'); };
  c.addEventListener('pointerup',end); c.addEventListener('pointercancel',end);
}

    const list=Object.values(g); toast('Creating '+list.length+' invoices…'); for(const x of list){ await saveDoc('invoices','inv-'+invKey(x.invoiceNo).replace(/[^A-Z0-9]/g,''),{invoiceNo:x.invoiceNo,customer:FS().customer,endClient:FS().endClient,date:x.date||'',dueDate:'',net:0,vat:0,status:'issued',paidOther:0,notes:'Created from service tickets — enter the amount',at:new Date().toISOString()},invoices); }
    logAction('Created invoices from tickets',{detail:list.length+' invoices'}); toast(list.length+' invoices created — enter their amounts'); return; }
  if(ds.atab){ adminTab=ds.atab; render(); return; }
  if(ds.grant){ if(ds.nm) names[ds.grant]=ds.nm; await setRole(ds.grant,ds.r,ds.nm); return; }
  if(ds.resetpin){ try{ await db.doc('pins/'+ds.resetpin).delete(); logAction('Reset sign-in (PIN and authenticator)',{detail:ds.resetpin===uid()?'Own sign-in':nameOf(ds.resetpin)||'Person'}); if(ds.resetpin===uid()){ toast('Your sign-in was reset. Set it up again now.'); signOut(); } else toast('Sign-in reset. '+(nameOf(ds.resetpin)||'They')+' will set up a new PIN and authenticator at next sign-in.'); }catch(e){ toast('Only admins can reset PINs.'); } return; }
  if(ds.unrole){ await setRole(ds.unrole,null); return; }
  if(ds.dismiss){ try{ await db.doc('requests/'+ds.dismiss).delete(); }catch(e){ toast('Could not dismiss the request.'); } return; }
  if(ds.act==='reqaccess'){ if(!db||!me.id) return; try{ await db.doc('requests/'+me.id).set({at:new Date().toISOString()}); requested=true; render(); }catch(e){ toast('Could not send the request. Try again.'); } return; }
  if(ds.ptype){ pui.type=ds.ptype; render(); return; }
  if(ds.dm){ pui.dmOnly=ds.dm==='1'; render(); return; }
  if(ds.delpart){ if(pui.del!==ds.delpart){ pui.del=ds.delpart; render(); return; } pui.del=null; logAction('Deleted part entry',{ticket:(parts[ds.delpart]||{}).ticket,detail:(parts[ds.delpart]||{}).name}); await delDoc('parts',ds.delpart,parts); toast('Entry deleted'); return; }
  if(ds.delstock){ if(pui.del!==ds.delstock){ pui.del=ds.delstock; render(); return; } pui.del=null; logAction('Deleted stock count',{detail:(stock[ds.delstock]||{}).item}); await delDoc('stock',ds.delstock,stock); toast('Count deleted'); return; }
  if(ds.step&&v&&!canEditTicket(v)) return;
  if(ds.step&&v){
    if(ds.step==='prepare'){ const n=clone(v); n.prepared=!n.prepared; n.contactedAt=n.prepared?new Date().toISOString():null; await save(n,n.prepared?'Marked job prepared':'Reopened prepare step'); toast(n.prepared?'Marked as contacted':'Prepare step reopened'); return; }
    mode=ds.step; draft=clone(v); draft.parts=draft.parts||[]; draft.evidence=evItems(draft); if(!draft.technician&&me.name) draft.technician=me.name; render(); return;
  }
  if(ds.stamp){ draft[ds.stamp]=draft[ds.stamp]?null:new Date().toISOString(); render(); return; }
  if(ds.outcome){ draft.outcome=draft.outcome===ds.outcome?'':ds.outcome; render(); return; }
  if(ds.ret){ draft.returnVisit=ds.ret; render(); return; }
  if(ds.area!==undefined&&draft){ const a=DM_AREAS[+ds.area], cur=areasOf(draft); draft.washroom=(cur.includes(a)?cur.filter(x=>x!==a):[...cur,a]).join('\n'); render(); return; }
  if(ds.rmev){ draft.evidence.splice(+ds.rmev,1); render(); return; }
  if(ds.q){ const p=draft.parts[+ds.q]; p.qty+= +ds.dq; if(p.qty<=0) draft.parts.splice(+ds.q,1); render(); return; }
  if(ds.decide){
    const ov=visits[rev.id]; if(!ov) return; const note=rev.note.trim();
    if(ds.decide!=='completed'&&!note){ document.getElementById('o-err').textContent='Add a note so the technician knows why.'; document.getElementById('o-note').focus(); return; }
    const n=clone(ov);
    if(rev.edit&&rev.edit.id===ov.id){ n.billingRef=rev.edit.inv.trim(); n.internalNotes=rev.edit.int.trim(); }
    if(ds.decide==='completed'&&missingChecks(n).length&&rev.confirm!==ov.id){ rev.confirm=ov.id; render(); return; }
    n.status=ds.decide; n.history=[...(n.history||[]),hist(ds.decide,note)];
    rev.note=''; rev.confirm=null; rev.edit=null; rev.id=null; await save(n,{completed:'Marked completed',recheck:'Returned for recheck',cancelled:'Cancelled visit'}[ds.decide]);
    toast({completed:'#'+n.id+' marked completed',recheck:'#'+n.id+' returned to the technician',cancelled:'#'+n.id+' cancelled'}[ds.decide]); return;
  }
  const act=ds.act;
  if(act==='back'){ sel=null; mode='view'; draft=null; try{ history.replaceState(null,'','#tickets'); }catch(_){} render(); return; }
  if(act==='more'){ list.limit+=60; document.getElementById('l-body').innerHTML=listBody(); return; }
  if(act==='call'){ showCall=!showCall; render(); return; }
  if(act==='copy'){ const el=document.getElementById('phone-num'); try{ await navigator.clipboard.writeText(el.textContent); toast('Number copied'); }catch(err){ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Number selected. Copy it from here.'); } return; }
  if(act==='cancel'){ mode='view'; draft=null; uploading=0; render(); return; }
  if(act==='clearsig'){ draft.signature=null; render(); return; }
  if(act==='savevisit'||act==='saveparts'||act==='savebilling'){
    const d=draft, n=clone(visits[d.id]);
    if(act==='savevisit') Object.assign(n,{arrived:d.arrived||null,finished:d.finished||null,findings:(d.findings||'').trim(),work:(d.work||'').trim(),nextAction:(d.nextAction||'').trim(),outcome:d.outcome||'',returnVisit:d.returnVisit||'No',technician:(d.technician||'').trim(),serial:(d.serial||'').trim(),washroom:d.washroom||'',customerFeedback:(d.customerFeedback||'').trim(),evidence:d.evidence,signature:d.signature||null,signerName:(d.signerName||'').trim()});
    if(act==='saveparts'){ const before={}, after={}; (n.parts||[]).forEach(p=>{ if(p.invId) before[p.invId]=(before[p.invId]||0)+(+p.qty||0); }); d.parts.forEach(p=>{ if(p.invId) after[p.invId]=(after[p.invId]||0)+(+p.qty||0); });
      for(const iid of new Set([...Object.keys(before),...Object.keys(after)])){ const it=inventory[iid]; const delta=(after[iid]||0)-(before[iid]||0); if(!it||!delta) continue; const {id,...rest}=it; const ns=Math.max(0,(+it.stock||0)-delta); logAction(delta>0?'Took stock for ticket':'Returned stock from ticket',{ticket:n.id,detail:it.partNo+': '+(+it.stock||0)+' → '+ns}); saveDoc('inventory',iid,Object.assign(rest,{stock:ns,at:new Date().toISOString()}),inventory); if(ns<=(+it.min||0)) setTimeout(()=>toast(it.partNo+' is now '+(ns<=0?'out of stock':'below minimum')),1200); }
      n.parts=d.parts; }
    if(act==='savebilling'){ n.billingRef=d.billingRef||''; n.billKind=d.billKind||''; n.waitMins=+d.waitMins||0; }
    mode='view'; draft=null; await save(n,{savevisit:'Updated visit report',saveparts:'Updated parts used',savebilling:'Updated Z invoice no.'}[act]); toast('Saved'); return;
  }
  if(act==='submit'&&v){ if(!canSubmit(v)||!canEditTicket(v)) return; const n=clone(v); n.status='review'; n.history=[...(n.history||[]),hist('review')]; await save(n,'Submitted for review'); toast('Submitted for review'); return; }
  if(act==='signout'){ signOut(); return; }
  if(act==='unconfirm'){ rev.confirm=null; render(); return; }
  if(act==='savedetails'){ const ov=visits[rev.id]; if(!ov||!rev.edit) return; const n=clone(ov); n.billingRef=rev.edit.inv.trim(); n.internalNotes=rev.edit.int.trim(); await save(n,'Updated office details'); toast('Details saved for #'+n.id); return; }
  if(act==='rpdf'){ await reportPdf(); return; }
  if(act==='rcsv'){ const m=rui.month, ids=new Set(monthData(m).xs.map(v=>v.id)); const all=visits; const keep={}; for(const k in all) if(ids.has(k)) keep[k]=all[k]; const saved=visits; visits=keep; const csv=toCsv(); visits=saved; try{ await downloadsApi.save({filename:'ziar-imaar-kohler-tickets-'+m+'.csv',data:csv}); toast('CSV saved'); }catch(err){ if(!(err&&err.code==='declined')) toast('Could not export the CSV.'); } return; }
  if(act==='csv'){ try{ await downloadsApi.save({filename:'ziar-imaar-kohler-tickets-'+dayKey(new Date().toISOString())+'.csv',data:toCsv()}); toast('CSV saved'); }catch(err){ if(!(err&&err.code==='declined')) toast('Could not export the CSV. Try again in a moment.'); } return; }
  if(act==='draftnote'){
    const ov=visits[rev.id]; if(!ov) return; rev.drafting=true; render();
    const prompt=`You help an office reviewer at a UAE technical-services company write a short note to a field technician about a Kohler service visit.
Write 1 to 3 plain sentences addressed to the technician, saying exactly what to fix or add before the visit can be closed. If nothing needs fixing, write a one-sentence approval note. No greeting, no sign-off, no markdown.

Ticket #${ov.id} at ${siteOf(ov)} (${ov.product||'product not recorded'}, ${ov.model||'model not recorded'}). Issue: ${ov.issue||'not recorded'}.
Time in ${hm(ov.arrived)||'not stamped'}, time out ${hm(ov.finished)||'not stamped'}. Outcome: ${ov.outcome||'not set'}. Technicians: ${ov.technician||'not named'}.
Findings: ${ov.findings||'none'}. Action taken: ${ov.work||'none'}. Next action: ${ov.nextAction||'none'}. Return visit: ${ov.returnVisit||'No'}.
Parts: ${(ov.parts||[]).map(p=>p.name+' x'+p.qty).join(', ')||'none'}. Evidence files: ${evItems(ov).length}. Customer signature: ${ov.signature?'yes':'no'}.
Required items still missing: ${missingChecks(ov).map(c=>c.f).join(', ')||'none'}.`;
    try{ const r=await sampleApi(prompt,{modelTier:'quick'}); rev.note=((r&&r.text)||'').trim(); }
    catch(err){ const c=err&&err.code; if(c==='not_granted') sampleApi=null; else toast(c==='rate_limited'?'Too many drafts just now. Try again in a minute.':'Could not draft a note. Write it yourself or try again.'); }
    rev.drafting=false; if(route==='review') render(); return;
  }
});

$app.addEventListener('mousemove',e=>{ const el=e.target.closest('[data-tip]'); if(el) showTip(el,e.clientX,e.clientY); else tipEl.hidden=true; });

(async()=>{
  const fallback=setTimeout(()=>{ if(!db) goDemo(); else toast('Still connecting to the shared data…'); },10000);
  const use=n=>window.claude&&window.claude.use?Promise.resolve(window.claude.use(n)).catch(()=>null):Promise.resolve(null);
  db=await use('db');
  if(!db){ clearTimeout(fallback); goDemo(); }
  use('user').then(async u=>{ userApi=u; if(!u){ canEditLvl=false; safeRender(); return; } try{ const v=await u.me(); me={id:v.id||(u.id?await u.id():null),name:v.name||''}; isOwnerFlag=!!(v.isOwner||(u.isOwner&&await u.isOwner())); canEditLvl=!!(v.canEdit||isOwnerFlag||await u.canEdit()); }catch(e){ canEditLvl=false; } safeRender(); resolveNames(); });
  setTimeout(()=>{ if(canEditLvl===null){ canEditLvl=false; safeRender(); } },10000);
  use('assets').then(a=>{ assets=a; safeRender(); });
  use('sample').then(s=>{ sampleApi=s; safeRender(); });
  use('downloads').then(d=>{ downloadsApi=d; safeRender(); });
  use('mcp').then(m=>{ mcpApi=m; if(route==='integrations') safeRender(); });
  use('permissions').then(pm=>{ permApi=pm; });
  setTimeout(()=>airtableAutoStart(),9000);
  setTimeout(flushQ,3000);
  if(!db) return;
  const sub=(col,store)=>db.collection(col).onSnapshot(snap=>{ for(const k in store) delete store[k]; snap.docs.forEach(d=>{ const x=d.data(); if(x) store[d.id]=Object.assign({id:d.id},x); }); overlayQ(col,store); lastSync=Date.now(); if(['parts','assets','tickets','finance'].includes(route)) safeRender(); resolveNames(); },()=>{});
  sub('parts',parts); sub('stock',stock); sub('assets',assetReg); sub('inventory',inventory);
  const fsub=(col,store)=>db.collection(col).onSnapshot(snap=>{ for(const k in store) delete store[k]; snap.docs.forEach(d=>{ const x=d.data(); if(x) store[d.id]=Object.assign({id:d.id},x); }); overlayQ(col,store); lastSync=Date.now(); finSeen.add(col); scheduleFinAuto(); if(route==='finance'||route==='dashboard') safeRender(); },()=>{});
  fsub('bankAccounts',bankAccounts); fsub('bankTx',bankTx); fsub('invoices',invoices); fsub('partnerTx',partnerTx); fsub('finSettings',finSettings); fsub('statements',statements); fsub('journals',journals); fsub('bills',bills);
  db.collection('roles').onSnapshot(snap=>{ roles={}; snap.docs.forEach(d=>{ const x=d.data(); if(x) roles[d.id]=x; }); rolesLoaded=true; render(); resolveNames(); },()=>{ rolesLoaded=true; render(); });
  db.collection('requests').onSnapshot(snap=>{ requests={}; snap.docs.forEach(d=>{ const x=d.data(); if(x) requests[d.id]=x; }); if(route==='admin'||access()==='none') safeRender(); resolveNames(); },()=>{});
  db.collection('audit').onSnapshot(snap=>{ audit=snap.docs.flatMap(d=>(((d.data()||{}).entries)||[]).map(x=>Object.assign({by:d.id},x))).sort((a,b)=>(b.at||'').localeCompare(a.at||'')).slice(0,300); if(route==='admin') safeRender(); resolveNames(); },()=>{});
  db.collection('visits').onSnapshot(snap=>{
    clearTimeout(fallback); if(demo) return;
    const next={}; snap.docs.forEach(d=>{ const x=d.data(); if(x){ const v=Object.assign({id:d.id,history:[],parts:[],evidence:[]},x); if(!STATUS[v.status]) v.status=(v.history[v.history.length-1]||{}).status||'new'; next[d.id]=v; } });
    syncQ.filter(q=>q.col==='visits'&&q.data).forEach(q=>{ next[q.id]=Object.assign({id:q.id,history:[],parts:[],evidence:[]},q.data); });
    if(loaded){ const now=Date.now(), ch=Object.keys(next).filter(id=>(!visits[id]||(visits[id].updatedAt||'')!==(next[id].updatedAt||''))&&!(mineRecent['visits/'+id]&&now-mineRecent['visits/'+id]<6000));
      if(ch.length){ if(sel&&ch.includes(sel)&&mode!=='view') toast('Ticket #'+sel+' was just changed by someone else — check before you save, or your save will replace their change.'); else toast(ch.length===1?(visits[ch[0]]?'Ticket #'+ch[0]+' was just updated by your team':'New ticket #'+ch[0]+' added by your team'):ch.length+' tickets were just updated by your team'); } }
    lastSync=Date.now(); visits=next; loaded=true; safeRender(); resolveNames(); scheduleFinAuto();
  },()=>{ clearTimeout(fallback); db=null; goDemo(); toast('Could not reach the shared store, showing demo data.'); });
})();
